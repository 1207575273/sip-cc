name: Build & Release

on:
  push:
    branches:
      - release
  workflow_dispatch:

jobs:
  # 第一步：自动递增 patch 版本号（仅在版本未变时），确保每次 release 推送都有新版本
  bump-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      bumped: ${{ steps.check.outputs.bumped }}
      changelog: ${{ steps.changelog.outputs.changelog }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 0

      - name: Read current version
        id: version
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $VERSION"

      - name: Check if tag already exists
        id: check
        run: |
          VERSION=${{ steps.version.outputs.version }}
          if git ls-remote --tags origin | grep -q "refs/tags/app-v${VERSION}$"; then
            echo "Tag app-v${VERSION} exists, need bump"
            echo "bumped=true" >> $GITHUB_OUTPUT

            # 递增 patch 版本号
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
            NEW_PATCH=$((PATCH + 1))
            NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"
            echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
            echo "Bumping to: $NEW_VERSION"

            # 更新三个文件
            sed -i "s/\"version\": \"${VERSION}\"/\"version\": \"${NEW_VERSION}\"/" src-tauri/tauri.conf.json
            sed -i "s/\"version\": \"${VERSION}\"/\"version\": \"${NEW_VERSION}\"/" package.json
            sed -i "s/^version = \"${VERSION}\"/version = \"${NEW_VERSION}\"/" src-tauri/Cargo.toml

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: auto bump version ${VERSION} → ${NEW_VERSION}"
            git push origin release
          else
            echo "Tag app-v${VERSION} does not exist, no bump needed"
            echo "bumped=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git tag --sort=-v:refname --list 'app-v*' | head -1)
          echo "Previous tag: ${PREV_TAG:-none}"

          if [ -z "$PREV_TAG" ]; then
            LOG=$(git log --pretty=format:"- %s (%h)" --no-merges -30)
          else
            LOG=$(git log --pretty=format:"- %s (%h)" --no-merges "${PREV_TAG}..HEAD")
          fi

          # 过滤掉自动版本递增的提交
          LOG=$(echo "$LOG" | grep -v "^- chore: auto bump" || true)

          if [ -z "$LOG" ]; then
            LOG="- 常规更新与 Bug 修复"
          fi

          {
            echo "changelog<<CHANGELOG_EOF"
            echo "$LOG"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: bump-version
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon (arm64)
          - platform: macos-latest
            rust-target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin

          # macOS Intel (x86_64) — 在 Apple Silicon runner 上交叉编译
          - platform: macos-latest
            rust-target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin

          # Windows x64
          - platform: windows-latest
            rust-target: ''
            args: ''

          # Linux x64
          - platform: ubuntu-24.04
            rust-target: ''
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout (latest, including auto-bump)
        uses: actions/checkout@v4
        with:
          ref: release

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # Linux 需要额外的系统依赖
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libpipewire-0.3-dev \
            libclang-dev \
            libgbm-dev \
            libdrm-dev \
            libegl1-mesa-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__
          releaseName: 'sip-cc v__VERSION__'
          releaseBody: |
            ## 更新内容
            ${{ needs.bump-version.outputs.changelog }}

            ## 下载
            | 平台 | 文件 |
            |------|------|
            | macOS (Apple Silicon) | `*.dmg` / `*.app.tar.gz` |
            | macOS (Intel)         | `*.dmg` / `*.app.tar.gz` |
            | Windows 安装版        | `*_x64-setup.exe` / `*.msi` |
            | Windows 便携版        | `*_windows_x64_portable.zip` |
            | Linux                 | `*.AppImage` / `*.deb` |
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # Windows 额外打包便携版 zip
      - name: Package Windows portable zip
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $version = (Get-Content "src-tauri/tauri.conf.json" | ConvertFrom-Json).version
          $tagName  = "app-v${version}"
          $exePath  = "src-tauri/target/release/sip-cc.exe"
          $zipName  = "sip-cc_${version}_windows_x64_portable.zip"

          Write-Host "=== Portable zip build ==="
          Write-Host "Version : $version"
          Write-Host "Tag     : $tagName"
          Write-Host "Zip     : $zipName"

          if (-not (Test-Path $exePath)) {
            Write-Error "sip-cc.exe not found at $exePath"
            exit 1
          }

          Compress-Archive -Path $exePath -DestinationPath $zipName -Force
          Write-Host "Zip created: $(Get-Item $zipName | Select-Object -ExpandProperty Length) bytes"

          Write-Host "=== Current releases ==="
          gh release list --repo $env:GITHUB_REPOSITORY

          Write-Host "=== Uploading to $tagName ==="
          gh release upload $tagName $zipName --clobber --repo $env:GITHUB_REPOSITORY
          Write-Host "Upload done."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
