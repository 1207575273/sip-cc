name: Build & Release

on:
  push:
    branches:
      - release
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon (arm64)
          - platform: macos-latest
            rust-target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin

          # macOS Intel (x86_64) — 在 Apple Silicon runner 上交叉编译
          - platform: macos-latest
            rust-target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin

          # Windows x64
          - platform: windows-latest
            rust-target: ''
            args: ''

          # Linux x64
          - platform: ubuntu-24.04
            rust-target: ''
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # Linux 需要额外的系统依赖
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libpipewire-0.3-dev \
            libclang-dev \
            libgbm-dev \
            libdrm-dev \
            libegl1-mesa-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__
          releaseName: 'sip-cc v__VERSION__'
          releaseBody: |
            ## 更新内容
            请查看下方资产文件下载对应平台安装包。

            | 平台 | 文件 |
            |------|------|
            | macOS (Apple Silicon) | `*.dmg` / `*.app.tar.gz` |
            | macOS (Intel)         | `*.dmg` / `*.app.tar.gz` |
            | Windows 安装版        | `*_x64-setup.exe` / `*.msi` |
            | Windows 便携版        | `*_windows_x64_portable.zip` |
            | Linux                 | `*.AppImage` / `*.deb` |
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # Windows 额外打包便携版 zip（解压即用，无需安装，依赖系统自带 WebView2）
      - name: Package Windows portable zip
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $version = (Get-Content "src-tauri/tauri.conf.json" | ConvertFrom-Json).version
          $tagName  = "app-v${version}"
          $exePath  = "src-tauri/target/release/sip-cc.exe"
          $zipName  = "sip-cc_${version}_windows_x64_portable.zip"

          Write-Host "=== Portable zip build ==="
          Write-Host "Version : $version"
          Write-Host "Tag     : $tagName"
          Write-Host "Zip     : $zipName"

          if (-not (Test-Path $exePath)) {
            Write-Error "sip-cc.exe not found at $exePath"
            exit 1
          }

          Compress-Archive -Path $exePath -DestinationPath $zipName -Force
          Write-Host "Zip created: $(Get-Item $zipName | Select-Object -ExpandProperty Length) bytes"

          Write-Host "=== Current releases ==="
          gh release list --repo $env:GITHUB_REPOSITORY

          Write-Host "=== Uploading to $tagName ==="
          gh release upload $tagName $zipName --clobber --repo $env:GITHUB_REPOSITORY
          Write-Host "Upload done."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
